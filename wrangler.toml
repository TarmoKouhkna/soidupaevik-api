name = "soidupaevik-api"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "soidupaevik-db"
database_id = "e51ac278-ec1c-484b-8c9d-4879af74a484"

# Daily refresh of Estonia fuel prices (06:00 UTC). Handler: scheduled() in worker.js.
[triggers]
crons = ["0 6 * * *"]

[vars]
# Frontend origin for CORS. Matches the live site. JWT_SECRET is configured in
# the Cloudflare dashboard (not here) — always deploy with `--keep-vars` so it
# is preserved and existing user sessions are not invalidated.
# RESEND_API_KEY (password reset mails) is a secret too: `wrangler secret put`.
# Origin is also the base of the reset link mailed to users.
ALLOWED_ORIGIN = "https://soidud.org"

# Workers Logs: console.error from ctx.waitUntil work (e.g. a failed reset
# mail — forgot-password always answers 200, so the log is the only place a
# send failure shows up) is visible in the dashboard under Observability.
[observability]
enabled = true
